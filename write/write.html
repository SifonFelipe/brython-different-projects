<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escribir</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', serif;
    background: #faf9f7;
    color: #2c2c2a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }

  body.dark {
    background: #1a1a18;
    color: #d3d1c7;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 0.5px solid rgba(0,0,0,0.08);
    flex-shrink: 0;
    transition: border-color 0.3s;
  }

  body.dark .topbar {
    border-bottom-color: rgba(255,255,255,0.07);
  }

  .wordcount {
    font-size: 12px;
    color: #888780;
    letter-spacing: 0.04em;
    font-family: 'Georgia', serif;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 6px;
    color: #888780;
    font-size: 13px;
    font-family: 'Georgia', serif;
    transition: background 0.15s, color 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn:hover {
    background: rgba(0,0,0,0.05);
    color: #2c2c2a;
  }

  body.dark .btn:hover {
    background: rgba(255,255,255,0.06);
    color: #d3d1c7;
  }

  .btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }

  .font-size-btn {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 5px;
    border: 0.5px solid rgba(0,0,0,0.12);
    color: #888780;
    background: none;
    cursor: pointer;
    font-family: 'Georgia', serif;
    transition: all 0.15s;
  }

  body.dark .font-size-btn {
    border-color: rgba(255,255,255,0.1);
  }

  .font-size-btn:hover {
    border-color: rgba(0,0,0,0.25);
    color: #2c2c2a;
  }

  body.dark .font-size-btn:hover {
    border-color: rgba(255,255,255,0.2);
    color: #d3d1c7;
  }

  .divider {
    width: 0.5px;
    height: 18px;
    background: rgba(0,0,0,0.1);
  }

  body.dark .divider {
    background: rgba(255,255,255,0.1);
  }

  .editor-wrap {
    flex: 1;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    padding: 60px 24px;
  }

  textarea {
    width: 100%;
    max-width: 660px;
    height: 100%;
    min-height: 400px;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Georgia', serif;
    font-size: 18px;
    line-height: 1.85;
    color: inherit;
    caret-color: #7F77DD;
    overflow: hidden;
  }

  textarea::placeholder {
    color: rgba(136,135,128,0.45);
  }

  .statusbar {
    padding: 10px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-top: 0.5px solid rgba(0,0,0,0.06);
    flex-shrink: 0;
    transition: border-color 0.3s;
  }

  body.dark .statusbar {
    border-top-color: rgba(255,255,255,0.06);
  }

  .status-item {
    font-size: 11px;
    color: rgba(136,135,128,0.55);
    font-family: 'Georgia', serif;
    letter-spacing: 0.03em;
  }

  .saved-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #1D9E75;
    display: inline-block;
    margin-right: 5px;
    opacity: 0;
    transition: opacity 0.4s;
  }

  .saved-dot.show { opacity: 1; }

  body.focus-mode .topbar,
  body.focus-mode .statusbar {
    opacity: 0;
    transition: opacity 0.5s;
  }

  body.focus-mode:hover .topbar,
  body.focus-mode:hover .statusbar {
    opacity: 1;
  }
</style>
</head>
<body>

<div class="topbar">
  <span class="wordcount" id="wc">0 palabras</span>

  <div class="controls">
    <button class="font-size-btn" id="smaller" title="Texto más pequeño">A−</button>
    <button class="font-size-btn" id="larger" title="Texto más grande">A+</button>

    <div class="divider"></div>

    <button class="btn" id="focus-btn" title="Modo enfoque">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>

    <button class="btn" id="theme-btn" title="Cambiar tema">
      <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
      </svg>
      <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </button>

    <button class="btn" id="download-btn" title="Descargar texto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
  </div>
</div>

<div class="editor-wrap">
  <textarea id="editor" placeholder="Empezá a escribir..." spellcheck="true" autocomplete="off"></textarea>
</div>

<div class="statusbar">
  <span class="status-item"><span class="saved-dot" id="dot"></span>guardado</span>
  <span class="status-item" id="char-count">0 caracteres</span>
  <span class="status-item" id="read-time">0 min de lectura</span>
</div>

<script>
  const editor = document.getElementById('editor');
  const wcEl = document.getElementById('wc');
  const charEl = document.getElementById('char-count');
  const rtEl = document.getElementById('read-time');
  const dot = document.getElementById('dot');
  let fontSize = 18;
  let saveTimer;
  let darkMode = false;
  let focusMode = false;

  function updateStats() {
    const text = editor.value;
    const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
    const chars = text.length;
    const mins = Math.max(1, Math.round(words / 200));
    wcEl.textContent = words === 1 ? '1 palabra' : `${words} palabras`;
    charEl.textContent = `${chars} caractere${chars === 1 ? '' : 's'}`;
    rtEl.textContent = `${mins} min de lectura`;
  }

  function triggerSave() {
    dot.classList.add('show');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      localStorage.setItem('draft', editor.value);
    }, 600);
  }

  const saved = localStorage.getItem('draft');
  if (saved) { editor.value = saved; updateStats(); }

  editor.addEventListener('input', () => { updateStats(); triggerSave(); autoResize(); });

  function autoResize() {
    editor.style.height = 'auto';
    editor.style.height = editor.scrollHeight + 'px';
  }
  autoResize();

  document.getElementById('theme-btn').addEventListener('click', () => {
    darkMode = !darkMode;
    document.body.classList.toggle('dark', darkMode);
    document.getElementById('icon-moon').style.display = darkMode ? 'none' : '';
    document.getElementById('icon-sun').style.display = darkMode ? '' : 'none';
  });

  document.getElementById('larger').addEventListener('click', () => {
    if (fontSize < 28) { fontSize += 2; editor.style.fontSize = fontSize + 'px'; autoResize(); }
  });

  document.getElementById('smaller').addEventListener('click', () => {
    if (fontSize > 13) { fontSize -= 2; editor.style.fontSize = fontSize + 'px'; autoResize(); }
  });

  document.getElementById('focus-btn').addEventListener('click', () => {
    focusMode = !focusMode;
    document.body.classList.toggle('focus-mode', focusMode);
    editor.focus();
  });

  document.getElementById('download-btn').addEventListener('click', () => {
    const text = editor.value;
    if (!text.trim()) return;
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'texto.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  editor.focus();
</script>
</body>
</html>
