<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Un nuevo artículo de Sifon.">
    <title>Título del artículo — Sifon</title>
    <link rel="stylesheet" href="../styles.css">
    <script>(() => { const savedTheme = localStorage.getItem('theme'); if (savedTheme) document.documentElement.dataset.theme = savedTheme; })();</script>
  </head>
  <body>
    <header class="site-header wrap">
      <a class="wordmark" href="../" aria-label="Inicio de Sifon">Sifon<span>.</span></a>
      <button class="theme-toggle" type="button" aria-label="Cambiar el tema de color" aria-pressed="false"><span aria-hidden="true">◐</span><span class="theme-label">Tema</span></button>
    </header>
    <main class="wrap article">
      <a class="back" href="../">← Todos los escritos</a>
      <article>
        <header class="article-header">
          <p class="post-meta">Día de mes de año · X min de lectura</p>
          <h1>Título del artículo</h1>
        </header>
        <div class="article-copy">
          <p>Empezá a escribir acá.</p>
          <!--
          Subí una imagen a la carpeta images/ y luego eliminá estos comentarios.
          Usá un texto alternativo descriptivo: ayuda a quienes usan lectores de pantalla.
          <figure class="article-image">
            <img src="../images/tu-foto.jpg" alt="Describí lo que se ve en la imagen">
            <figcaption>Un epígrafe breve y opcional.</figcaption>
          </figure>
          -->
          <h2>Un título de sección</h2>
          <p>Mantené las oraciones breves y las ideas claras.</p>
        </div>
      </article>
    </main>
    <footer class="wrap site-footer"><p>Hecho despacio, desde Córdoba.</p><p>© 2026 Sifon</p></footer>
    <script src="../theme.js"></script>
  </body>
</html>
